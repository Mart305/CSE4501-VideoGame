name: ⚙️ CI/CD Dispatcher (Public)

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type: 'preview' for manual/dev builds, 'release_candidate' for staging, 'release' for production"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - release_candidate
          - release
      deployTargets:
        description: "JSON array of deploy targets"
        required: true
        default: '["itch.io"]'
        type: string
      buildTargets:
        description: "JSON array of build targets"
        required: true
        default: '["WebGL"]'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  validation:
    name: Validate Secrets
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check last commit for [skip ci]
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[skip ci]"* || "$COMMIT_MSG" == *"[ci skip]"* ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Required Secrets
        run: |
          REQUIRED_SECRETS=("UNITY_EMAIL" "UNITY_LICENSE" "UNITY_PASSWORD" "BUTLER_API_KEY" "ITCH_USER" "ITCH_GAME")
          MISSING=0
          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            VALUE_VAR="SECRET_${SECRET_NAME}"
            VALUE="${!VALUE_VAR}"
            if [[ -z "$VALUE" ]]; then
              echo "❌ Required secret '$SECRET_NAME' is not set!"
              MISSING=1
            else
              echo "✅ Secret '$SECRET_NAME' is present."
            fi
          done
          if [[ "$MISSING" -eq 1 ]]; then
            exit 1
          fi
        env:
          SECRET_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          SECRET_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          SECRET_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          SECRET_BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          SECRET_ITCH_USER: ${{ secrets.ITCH_USER }}
          SECRET_ITCH_GAME: ${{ secrets.ITCH_GAME }}

  build:
    name: 🛠️ Build WebGL
    needs: validation
    if: ${{ needs.validation.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    
    steps:
      - name: 🧹 Free Disk Space (Optimized)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h / | awk 'NR==2 {print "Used: " $3 " / Available: " $4 " (" $5 ")"}'
          
          # Only remove the largest items that actually exist
          echo "Removing Android SDK..."
          sudo rm -rf /usr/local/lib/android || true
          
          echo "Removing .NET..."
          sudo rm -rf /usr/share/dotnet || true
          
          echo "Removing tool cache..."
          sudo rm -rf /opt/hostedtoolcache || true
          
          echo "Removing swap..."
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          
          # Quick apt cleanup (no package removal)
          sudo apt-get clean
          
          echo ""
          echo "=== Disk space after cleanup ==="
          df -h / | awk 'NR==2 {print "Used: " $3 " / Available: " $4 " (" $5 ")"}'

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💾 Restore Unity Library Cache
        uses: actions/cache@v4
        with:
          path: |
            Tower Rush/Library
            Tower Rush/Library/BuildCache
            Tower Rush/Library/Il2cppBuildCache
          key: Library-WebGL-${{ hashFiles('Tower Rush/Assets/**', 'Tower Rush/Packages/**', 'Tower Rush/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: 🧹 Clear Artifact Cache (Force Texture Reimport)
        run: |
          echo "Clearing artifact cache to force texture reimport with new compression settings..."
          rm -rf "Tower Rush/Library/ArtifactDB"
          rm -rf "Tower Rush/Library/Artifacts"
          rm -rf "Tower Rush/Library/SourceAssetDB"
          echo "Cache cleared - textures will be reimported with 1024px max size and DXT compression"

      - name: 🎮 Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Tower Rush
          targetPlatform: WebGL
          unityVersion: 2022.3.62f1

      - name: 🔧 Fix Permissions
        run: sudo chown -R $USER:$USER build/

      - name: 🗑️ Remove Burst Debug Files
        run: find build/WebGL -name '*BurstDebugInformation_DoNotShip*' -exec rm -rf {} + || true

      - name: 🗜️ Optimize Build Size
        run: |
          echo "=== Build structure ==="
          ls -la build/WebGL/
          echo ""
          
          echo "=== Build size before optimization ==="
          du -sh build/WebGL
          find build/WebGL -type f -name "*.data*" -o -name "*.wasm*" -o -name "*.unityweb" | xargs du -h 2>/dev/null | sort -h || echo "No build files found yet"
          
          # Remove unnecessary files
          find build/WebGL -name "*.symbols.json" -delete || true
          find build/WebGL -name "*.debug.wasm" -delete || true
          find build/WebGL -name "*.pdb" -delete || true
          find build/WebGL -name "*.map" -delete || true
          
          # Remove development-only files (try both possible locations)
          rm -f build/WebGL/Build/*.symbols.json 2>/dev/null || true
          rm -f build/WebGL/*.symbols.json 2>/dev/null || true
          rm -f build/WebGL/Build/UnityLoader.js.mem 2>/dev/null || true
          rm -rf build/WebGL/Build/Streaming 2>/dev/null || true
          rm -rf build/WebGL/Streaming 2>/dev/null || true
          
          # Report individual file sizes
          echo ""
          echo "=== Build size after optimization ==="
          du -sh build/WebGL
          echo ""
          echo "=== Individual file sizes (top 20) ==="
          find build/WebGL -type f -exec du -h {} \; 2>/dev/null | sort -rh | head -20
          
          # Check all compressed files for size limits
          echo ""
          echo "=== Checking file sizes for itch.io compatibility ==="
          FAIL=0
          
          # Find all data and wasm files (both compressed and uncompressed)
          while IFS= read -r FILE; do
            if [ -f "$FILE" ]; then
              SIZE=$(du -m "$FILE" | cut -f1)
              FILENAME=$(basename "$FILE")
              echo "📦 $FILENAME: ${SIZE}MB"
              
              # itch.io has a ~1GB limit per file in ZIP
              if [ "$SIZE" -gt 900 ]; then
                echo "❌ ERROR: $FILENAME exceeds 900MB (${SIZE}MB) - will fail on itch.io!"
                FAIL=1
              elif [ "$SIZE" -gt 700 ]; then
                echo "⚠️  WARNING: $FILENAME is large (${SIZE}MB) - approaching itch.io limits"
              fi
            fi
          done < <(find build/WebGL -type f \( -name "*.data*" -o -name "*.wasm*" -o -name "*.unityweb" -o -name "*.framework.js*" -o -name "*.code.js*" \) 2>/dev/null)
          
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "❌ Build contains files too large for itch.io deployment!"
            echo "💡 Suggestions:"
            echo "   1. Enable Asset Bundle compression in Unity"
            echo "   2. Reduce texture quality/resolution"
            echo "   3. Remove unused assets"
            echo "   4. Use addressables for large assets"
            exit 1
          fi

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerRush-WebGL
          path: build/WebGL
          retention-days: 14

  deploy:
    needs: build
    name: 🕹️ Deploy to itch.io
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: TowerRush-WebGL
          path: deployment-artifacts/WebGL

      - name: 🧾 List Artifacts
        run: ls -R deployment-artifacts/

      - name: 🤵 Install Butler
        uses: remarkablegames/setup-butler@v1

      - name: 🚀 Deploy to itch.io
        run: |
          if [ -z "${{ secrets.ITCH_USER }}" ] || [ -z "${{ secrets.ITCH_GAME }}" ]; then
            echo "❌ Missing itch.io credentials"
            exit 1
          fi
          
          VERSION="${{ github.ref_name }}-${{ github.run_number }}"
          
          echo "➡️ Pushing WebGL build to itch.io channel: html5"
          butler push deployment-artifacts/WebGL ${{ secrets.ITCH_USER }}/${{ secrets.ITCH_GAME }}:html5 \
            --userversion "$VERSION" \
            --if-changed
          
          echo "✅ Successfully deployed to itch.io!"
          echo "🎮 Play at: https://${{ secrets.ITCH_USER }}.itch.io/${{ secrets.ITCH_GAME }}"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
