name: Build and Deploy to itch.io

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build-and-deploy:
    name: Build WebGL and Deploy to itch.io
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Tower Rush/Library
          key: Library-WebGL-${{ hashFiles('Tower Rush/Assets/**', 'Tower Rush/Packages/**', 'Tower Rush/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        with:
          projectPath: Tower Rush
          targetPlatform: WebGL
          buildName: TowerRush
          buildsPath: build
          unityVersion: auto

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-WebGL
          path: build/WebGL
          retention-days: 7

      - name: Deploy to itch.io
        uses: manleydev/butler-publish-itchio-action@v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
          ITCH_USER: ${{ secrets.ITCH_USER }}
          PACKAGE: build/WebGL
          VERSION: ${{ github.sha }}
