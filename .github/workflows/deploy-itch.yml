name: 🚀 Build and Deploy to itch.io

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🛠️ Build WebGL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    
    steps:
      - name: 🧹 Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💾 Restore Unity Library Cache
        uses: actions/cache@v4
        with:
          path: |
            Tower Rush/Library
            Tower Rush/Library/BuildCache
            Tower Rush/Library/Il2cppBuildCache
          key: Library-WebGL-${{ hashFiles('Tower Rush/Assets/**', 'Tower Rush/Packages/**', 'Tower Rush/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: 🎮 Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Tower Rush
          targetPlatform: WebGL
          unityVersion: 2022.3.62f1

      - name: 🔧 Fix Permissions
        run: sudo chown -R $USER:$USER build/

      - name: 🗑️ Remove Burst Debug Files
        run: find build/WebGL -name '*BurstDebugInformation_DoNotShip*' -exec rm -rf {} + || true

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerRush-WebGL
          path: build/WebGL
          retention-days: 14

  deploy:
    needs: build
    name: 🕹️ Deploy to itch.io
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: TowerRush-WebGL
          path: deployment-artifacts/WebGL

      - name: 🧾 List Artifacts
        run: ls -R deployment-artifacts/

      - name: 🤵 Install Butler
        uses: remarkablegames/setup-butler@v1

      - name: 🚀 Deploy to itch.io
        run: |
          if [ -z "${{ secrets.ITCH_USER }}" ] || [ -z "${{ secrets.ITCH_GAME }}" ]; then
            echo "❌ Missing itch.io credentials"
            exit 1
          fi
          
          echo "➡️ Pushing WebGL build to itch.io channel: html5"
          butler push deployment-artifacts/WebGL ${{ secrets.ITCH_USER }}/${{ secrets.ITCH_GAME }}:html5 --userversion ${{ github.sha }}
          
          echo "✅ Successfully deployed to itch.io!"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
